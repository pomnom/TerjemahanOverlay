name: Build APK

# Upload TerjemahOverlay.zip ke repo → workflow mengekstrak isinya ke repo, menghapus zip-nya,
# lalu membuat APK di halaman Releases. Tanpa zip, APK dibuat dari kode yang ada di repo.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Ekstrak TerjemahOverlay.zip ke repo
        run: |
          if [ ! -f TerjemahOverlay.zip ]; then
            echo "Tidak ada TerjemahOverlay.zip — memakai kode yang sudah ada di repo."
            exit 0
          fi
          rm -rf /tmp/src && mkdir -p /tmp/src
          unzip -q TerjemahOverlay.zip -d /tmp/src
          SRC=/tmp/src
          [ -d /tmp/src/TerjemahOverlay ] && SRC=/tmp/src/TerjemahOverlay
          # Folder .github tidak disentuh: token Actions tidak boleh mengubah file workflow.
          rsync -a --delete \
            --exclude '.git/' --exclude '.github/' --exclude 'TerjemahOverlay.zip' \
            "$SRC"/ ./
          rm -f TerjemahOverlay.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Isi zip sama dengan repo."
          else
            git commit -q -m "Ekstrak TerjemahOverlay.zip (build ${{ github.run_number }})"
            git push origin "HEAD:${{ github.ref_name }}" || echo "Push dilewati: ada commit baru."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Kunci tetap (opsional): isi Secrets TO_KEYSTORE_B64 & TO_STORE_PASSWORD supaya APK baru
      # bisa dipasang di atas versi lama. Tanpa Secrets, APK tetap dibuat dengan kunci debug.
      - name: Kunci tanda tangan dari Secrets
        env:
          TO_KEYSTORE_B64: ${{ secrets.TO_KEYSTORE_B64 }}
          TO_STORE_PASSWORD: ${{ secrets.TO_STORE_PASSWORD }}
        run: |
          if [ -n "$TO_KEYSTORE_B64" ] && [ -n "$TO_STORE_PASSWORD" ]; then
            echo "$TO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/terjemah.keystore"
            echo "TO_KEYSTORE_FILE=$RUNNER_TEMP/terjemah.keystore" >> "$GITHUB_ENV"
            echo "TO_STORE_PASSWORD=$TO_STORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::Secrets kunci belum diisi — APK memakai kunci debug (update perlu uninstall dulu)."
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk TerjemahOverlay.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerjemahOverlay-apk
          path: TerjemahOverlay.apk

      - name: Catatan rilis
        run: |
          NOTES=app/src/main/assets/changelog.txt
          PREV=$(git tag --list 'build-*' --sort=-v:refname | head -n 1)
          if [ -f "$NOTES" ] && { [ -z "$PREV" ] || ! git diff --quiet "$PREV" -- "$NOTES"; }; then
            sed -e 's/^# \(.*\)/### \1/' "$NOTES" > RELEASE_NOTES.md
          else
            echo "- Perbaikan kecil." > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Terjemah Overlay build ${{ github.run_number }}
          body_path: RELEASE_NOTES.md
          files: TerjemahOverlay.apk
          make_latest: true
